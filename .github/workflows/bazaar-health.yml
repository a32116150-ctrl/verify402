name: bazaar-health

# Daily check that every paid route can still be found and bought.
#
# Free: no wallet, no payment, no API key, no secrets. It reads each route's 402
# challenge, asks CDP's public /validate about it, and counts how many of our
# six routes the Bazaar catalog still lists.
#
# This exists because two defects each broke a paid route for every payer and
# produced no alert: the payer never sent extensions.bazaar (so settlements were
# never cataloged), and /safety's description was 501 characters (so that route
# answered 502 to everyone). Both are visible without spending anything.
#
# A red run means one of:
#   * a route stopped returning a valid 402 (broken paywall, bad deploy),
#   * a description crossed CDP's 500-character limit,
#   * a listing aged out (30 days without a settlement) — settle it once to relist.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazaar-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check paid routes and Bazaar listings
        run: node scripts/bazaar-health.mjs
