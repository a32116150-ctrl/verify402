# Render Blueprint: one-click deploy.
#
# Node runtime, free plan, testnet by default. The only required env var is
# already defaulted; mainnet config comes later per DEPLOY.md.
services:
  - type: web
    name: verify402
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node src/server.mjs
    healthCheckPath: /health
    envVars:
      - key: X402_MODE
        value: testnet
      - key: FACILITATOR_URL
        value: https://x402.org/facilitator
      - key: NODE_VERSION
        value: "22"
      # Generated once by Render and stored as an environment secret. It never
      # enters git. Used to make /preflight receipts stable across restarts and
      # instances.
      - key: PREFLIGHT_SECRET
        generateValue: true
    # Durability cutover (see DEPLOY.md 3.1/3.2). Disks require a paid instance,
    # so this stays commented while the demo is on the free plan. Uncomment all
    # three blocks together, deploy, then run `npm run check:durability`.
    #
    # disk:
    #   name: recovery
    #   mountPath: /var/data
    #   sizeGB: 1
    #
    # envVars (add):
    #   - key: RECOVERY_DB_PATH
    #     value: /var/data/recovery/recovery.sqlite
